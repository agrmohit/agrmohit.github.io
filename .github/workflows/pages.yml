# Publishes the site to GitHub Pages. Only the paths listed below go online
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # _site exists only on the runner: the files that go online, copied out of the checkout
      - name: Collect the site
        run: |
          mkdir _site
          cp -R index.html 404.html favicon.ico robots.txt sitemap.xml .well-known assets projects _site/

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true # since v4 dotfiles are left out by default, and .well-known is one
      - id: deployment
        uses: actions/deploy-pages@v5
