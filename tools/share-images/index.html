<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; object-src 'none';"
    />
    <title>Contact card</title>
    <!-- The link-preview image (og:image). build.sh turns this page into assets/img/contact-card.png -->
    <link rel="stylesheet" href="style.css" />
    <style>
      .card {
        width: 1200px;
        height: 630px;
      }
      /* the scene centres the Earth, so a canvas twice as wide as the Earth's x puts it at x = 920 */
      canvas {
        left: 0;
        width: 1840px;
        height: 630px;
      }
      .text {
        left: 72px;
        top: 73px;
        font-size: 30px;
      }
      .name {
        font-size: 116px;
        -webkit-text-stroke: 2px #fff;
      }
      .role {
        margin-top: 22px;
        font-size: 50px;
      }
      .prompt {
        margin-top: 44px;
      }
      .contact {
        margin-top: 10px;
      }
    </style>
    <script type="module" src="sky.js"></script>
  </head>

  <body>
    <div class="card">
      <canvas data-scene="card"></canvas>
      <div class="text">
        <div class="name">Mohit Ra<span class="j">j</span></div>
        <div class="role">backend developer</div>
        <div class="prompt">$ <b>contact</b></div>
        <div class="contact">
          <span class="handle">@agrmohit</span> <span class="dot">·</span> <span>hi@agrmohit.com</span>
        </div>
      </div>
    </div>
  </body>
</html>
