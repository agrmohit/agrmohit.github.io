<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; object-src 'none';"
    />
    <title>Banner</title>
    <!-- The 3:1 banner for Bluesky, Mastodon and X. build.sh turns this page into assets/img/banner.png -->
    <link rel="stylesheet" href="style.css" />
    <style>
      .card {
        width: 1500px;
        height: 500px;
      }
      /* the scene centres the Earth: a 3000px canvas starting at -350px puts it at x = 1150 */
      canvas {
        left: -350px;
        width: 3000px;
        height: 500px;
      }
      /* Inside the zone every platform shows: Bluesky crops up to 65px off the top and bottom on
         desktop and 100px off each side on phones, and Mastodon's phone avatar covers x < 370, y > 230 */
      .text {
        left: 470px;
        top: 85px;
        font-size: 28px;
        line-height: 1.2;
      }
      .name {
        font-size: 96px;
        -webkit-text-stroke: 1.5px #fff;
      }
      .role {
        margin-top: 18px;
        font-size: 40px;
      }
      .prompt {
        margin-top: 28px;
      }
      .contact {
        margin-top: 6px;
      }
    </style>
    <script type="module" src="sky.js"></script>
  </head>

  <body>
    <div class="card">
      <canvas data-scene="banner"></canvas>
      <div class="text">
        <div class="name">Mohit Ra<span class="j">j</span></div>
        <div class="role">backend developer</div>
        <div class="prompt">$ <b>contact</b></div>
        <div class="contact">
          <span class="handle">@agrmohit</span> <span class="dot">·</span> <span>hi@agrmohit.com</span>
        </div>
      </div>
    </div>
  </body>
</html>
