<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; object-src 'none';"
    />
    <title>LinkedIn banner</title>
    <!-- The LinkedIn banner (4:1). build.sh turns this page into assets/img/banner-linkedin.png -->
    <link rel="stylesheet" href="style.css" />
    <style>
      .card {
        width: 1584px;
        height: 396px;
      }
      /* the scene centres the Earth: a 3200px canvas starting at -350px puts it at x = 1250 */
      canvas {
        left: -350px;
        width: 3200px;
        height: 396px;
      }
      /* starts right of the profile photo: on phones it covers x < 525 below y 185 */
      .text {
        left: 580px;
        top: 34px;
        font-size: 24px;
        line-height: 1.2;
      }
      .name {
        font-size: 84px;
        -webkit-text-stroke: 1.5px #fff;
      }
      .role {
        margin-top: 16px;
        font-size: 36px;
      }
      .prompt {
        margin-top: 26px;
      }
      .contact {
        margin-top: 6px;
      }
    </style>
    <script type="module" src="sky.js"></script>
  </head>

  <body>
    <div class="card">
      <canvas data-scene="linkedin"></canvas>
      <div class="text">
        <div class="name">Mohit Ra<span class="j">j</span></div>
        <div class="role">backend developer</div>
        <div class="prompt">$ <b>contact</b></div>
        <div class="contact">
          <span class="handle">@agrmohit</span> <span class="dot">·</span> <span>hi@agrmohit.com</span>
        </div>
      </div>
    </div>
  </body>
</html>
